<h2>Lista de disciplinas</h2>

<ul>
  <li
    *ngFor="let disciplina of disciplinas; let primeiro = first; let ultimo = last; let par = even; let impar = odd"
    [ngClass]="{
      'posicao-par': par,
      'posicao-impar': impar,
      'primeira-disciplina': primeiro,
      'ultima-disciplina': ultimo
    }"
  >
    {{ disciplina }}
  </li>
</ul>
