<h2>Exercício 2</h2>

<label>Produto:</label>
<input type="text" [(ngModel)]="produto">

<br><br>

<label>Preço:</label>
<input type="number" [(ngModel)]="preco">

<br><br>

<label>Quantidade:</label>
<input type="number" [(ngModel)]="quantidade">

<br><br>

<p>Produto: {{ produto }}</p>
<p>Preço: R$ {{ preco }}</p>
<p>Quantidade: {{ quantidade }}</p>

<p><strong>Total: R$ {{ preco * quantidade }}</strong></p>
